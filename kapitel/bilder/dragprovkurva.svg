<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img" aria-labelledby="t">
  <title id="t">Dragprovkurva för ett konstruktionsstål: spänning som funktion av töjning</title>
  <rect width="640" height="400" fill="#ffffff"/>
  <!-- Axlar -->
  <line x1="70" y1="340" x2="610" y2="340" stroke="#222" stroke-width="2"/>
  <line x1="70" y1="340" x2="70" y2="30" stroke="#222" stroke-width="2"/>
  <polygon points="610,335 620,340 610,345" fill="#222"/>
  <polygon points="65,30 70,20 75,30" fill="#222"/>
  <text x="600" y="368" text-anchor="end" fill="#222">Töjning ε</text>
  <text x="84" y="34" fill="#222">Spänning σ (N/mm²)</text>
  <!-- Elastiskt område -->
  <rect x="70" y="30" width="60" height="310" fill="#dbeafe" opacity="0.6"/>
  <text x="100" y="325" text-anchor="middle" font-size="12" fill="#1e3a8a">elastiskt</text>
  <!-- Kurva -->
  <path d="M70,340 L120,180 L128,170 L140,184 L190,178 C260,110 340,80 420,84 C470,88 510,120 545,170" fill="none" stroke="#b91c1c" stroke-width="3"/>
  <!-- Markeringar -->
  <line x1="70" y1="170" x2="128" y2="170" stroke="#555" stroke-dasharray="4 4"/>
  <text x="62" y="174" text-anchor="end" fill="#222">Re</text>
  <line x1="70" y1="82" x2="420" y2="82" stroke="#555" stroke-dasharray="4 4"/>
  <text x="62" y="86" text-anchor="end" fill="#222">Rm</text>
  <text x="130" y="158" fill="#222">sträckgräns</text>
  <text x="330" y="70" fill="#222">brottgräns (högsta spänning)</text>
  <circle cx="545" cy="170" r="5" fill="#b91c1c"/>
  <text x="552" y="165" fill="#222">brott</text>
  <text x="255" y="200" fill="#222">plastiskt område</text>
  <text x="255" y="218" fill="#222" font-size="12">formen blir bestående</text>
  <text x="130" y="262" fill="#1e3a8a" font-size="12">rät linje: σ = E · ε (Hookes lag)</text>
</svg>
