<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" height="280" font-family="Helvetica, Arial, sans-serif" font-size="14" role="img" aria-labelledby="t">
  <title id="t">Enskärigt och tvåskärigt förband: den skjuvade ytan markerad</title>
  <rect width="700" height="280" fill="#ffffff"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker>
  </defs>
  <!-- Enskärigt -->
  <text x="30" y="34" font-weight="bold" fill="#222">Enskärigt förband (en skjuvad yta)</text>
  <rect x="50" y="110" width="150" height="24" fill="#2b6cb0"/>
  <rect x="140" y="134" width="150" height="24" fill="#63b3ed"/>
  <rect x="160" y="96" width="26" height="76" fill="#888"/>
  <line x1="150" y1="134" x2="196" y2="134" stroke="#b91c1c" stroke-width="3" stroke-dasharray="6 3"/>
  <line x1="50" y1="122" x2="10" y2="122" stroke="#b91c1c" stroke-width="3" marker-end="url(#b)"/>
  <text x="14" y="112" fill="#b91c1c">F</text>
  <line x1="290" y1="146" x2="330" y2="146" stroke="#b91c1c" stroke-width="3" marker-end="url(#b)"/>
  <text x="318" y="136" fill="#b91c1c">F</text>
  <text x="60" y="210" fill="#222">As = π · d² / 4</text>
  <text x="60" y="232" fill="#222" font-size="12">Röd streckad linje = skjuvad yta</text>
  <!-- Tvåskärigt -->
  <text x="370" y="34" font-weight="bold" fill="#222">Tvåskärigt förband (två skjuvade ytor)</text>
  <rect x="390" y="86" width="150" height="20" fill="#2b6cb0"/>
  <rect x="390" y="158" width="150" height="20" fill="#2b6cb0"/>
  <rect x="470" y="118" width="150" height="28" fill="#63b3ed"/>
  <rect x="492" y="74" width="26" height="116" fill="#888"/>
  <line x1="484" y1="112" x2="526" y2="112" stroke="#b91c1c" stroke-width="3" stroke-dasharray="6 3"/>
  <line x1="484" y1="152" x2="526" y2="152" stroke="#b91c1c" stroke-width="3" stroke-dasharray="6 3"/>
  <line x1="390" y1="132" x2="350" y2="132" stroke="#b91c1c" stroke-width="3" marker-end="url(#b)"/>
  <text x="352" y="122" fill="#b91c1c">F</text>
  <line x1="620" y1="132" x2="660" y2="132" stroke="#b91c1c" stroke-width="3" marker-end="url(#b)"/>
  <text x="648" y="122" fill="#b91c1c">F</text>
  <text x="400" y="210" fill="#222">As = 2 · π · d² / 4</text>
  <text x="400" y="232" fill="#222" font-size="12">Samma tapp tål dubbelt så stor kraft</text>
</svg>
